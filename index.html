<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rosa Canela Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine-top:#7C1B2E;
    --wine-bottom:#3E0A16;
    --panel:rgba(245,237,230,0.06);
    --line:rgba(245,237,230,0.18);
    --rose:#D9A79E;
    --rose-dim:#C89089;
    --gold:#C9A227;
    --cream:#F5EDE6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(217,167,158,0.20) 0%, rgba(62,10,22,0) 55%),
      linear-gradient(180deg, var(--wine-top) 0%, var(--wine-bottom) 100%);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:44px 24px 28px;
    overflow-x:hidden;
  }

  .content{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
  }

  .monogram{
    width:112px; height:112px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(245,237,230,0.12), 0 8px 24px rgba(0,0,0,0.35);
  }
  .monogram img{ width:100%; height:100%; object-fit:cover; display:block; }

  header{ text-align:center; }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:34px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--cream);
  }
  .event-label{
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:12px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--rose);
  }
  .event-label .line{ width:22px; height:1px; background:var(--rose-dim); opacity:0.7; }
  .by-line{
    margin-top:10px;
    font-size:10.5px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:rgba(245,237,230,0.55);
  }

  nav{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--cream);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.01em;
    transition:transform .15s ease;
    backdrop-filter:blur(2px);
  }
  a.btn:active{ transform:scale(0.98); }
  a.btn .icon{
    width:22px; height:22px; flex:none;
    color:var(--rose);
  }
  a.btn.primary{
    background:linear-gradient(180deg, #E3C053, var(--gold));
    border:none;
    color:#3E0A16;
    font-weight:600;
  }
  a.btn.primary .icon{ color:#3E0A16; }

  footer{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .tagline{
    font-size:12px;
    color:var(--rose-dim);
    letter-spacing:0.03em;
  }
  .mark{
    font-family:'Inter', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.2em;
    color:var(--gold);
    text-transform:uppercase;
  }
</style>
</head>
